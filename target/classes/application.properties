spring.datasource.password=npg_YX3NlBML8GHE
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080


# ======================================================
# Spring AI - Chat LLM via OpenRouter
# ======================================================

# Provider de chat OpenAI-compatible
spring.ai.model.chat=openai

spring.ai.openai.api-key=${OPENROUTER_API_KEY}

# base-url sans /v1, completions-path ajoute /v1/chat/completions
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.completions-path=/v1/chat/completions

# Modele LLM texte + vision compatible OpenRouter
spring.ai.openai.chat.options.model=google/gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.2

# Headers optionnels OpenRouter
spring.ai.openai.chat.options.http-headers[HTTP-Referer]=http://localhost:8080
spring.ai.openai.chat.options.http-headers[X-OpenRouter-Title]=InsureFlow_Back


# ======================================================
# Embeddings : Ollama pour le RAG / Milvus
# ======================================================

spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.embedding.options.model=nomic-embed-text


# ======================================================
# Milvus
# ======================================================

milvus.host=localhost
milvus.port=19530
milvus.collection-name=sinistre
milvus.dimension=768
logging.level.io.milvus.client.AbstractMilvusGrpcClient=OFF
logging.level.io.milvus.client.MilvusServiceClient=OFF


ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text

# OpenRouter pour services custom LangChain4j
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.chat-model=anthropic/claude-sonnet-4.5
openrouter.vision-model=openai/gpt-4o
openrouter.chat-max-tokens=1000
openrouter.vision-max-tokens=1500
spring.ai.openai.chat.options.max-tokens=1000

# Upload fichiers
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

insureflow.dataset-api.base-url=http://localhost:8000
ml.cost-estimation.url=http://localhost:8001/predict-cost
ml.cost-estimation.enabled=true