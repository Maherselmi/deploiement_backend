# Nom de l'application
spring.application.name=InsureFlow_Back

# ======================================================
# Configuration PostgreSQL - NEON
# ======================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Serveur
server.port=${PORT:8080}

# ======================================================
# Spring AI - Chat LLM via OpenRouter
# ======================================================
spring.ai.model.chat=openai
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=google/gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=1000
spring.ai.openai.chat.options.http-headers[HTTP-Referer]=https://insureflow.onrender.com
spring.ai.openai.chat.options.http-headers[X-OpenRouter-Title]=InsureFlow_Back

# ======================================================
# Milvus - Zilliz Cloud
# ======================================================
milvus.host=${MILVUS_HOST}
milvus.port=443
milvus.token=${MILVUS_TOKEN}
milvus.collection-name=sinistre
milvus.dimension=768
logging.level.io.milvus.client.AbstractMilvusGrpcClient=OFF
logging.level.io.milvus.client.MilvusServiceClient=OFF

# ======================================================
# Ollama - Railway
# ======================================================
ollama.base-url=${OLLAMA_BASE_URL}
ollama.embedding-model=nomic-embed-text

# ======================================================
# OpenRouter - LangChain4j
# ======================================================
openrouter.base-url=https://openrouter.ai/api/v1
openrouter.api-key=${OPENROUTER_API_KEY}
openrouter.chat-model=anthropic/claude-sonnet-4.5
openrouter.vision-model=openai/gpt-4o
openrouter.chat-max-tokens=1000
openrouter.vision-max-tokens=1500

# ======================================================
# Upload fichiers
# ======================================================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ======================================================
# Services ML externes
# ======================================================
insureflow.dataset-api.base-url=${DATASET_API_URL:http://localhost:8000}
ml.cost-estimation.url=${ML_COST_URL:http://localhost:8001/predict-cost}
ml.cost-estimation.enabled=false